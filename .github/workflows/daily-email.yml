name: Daily email report (8:31 CT)

# Every morning at 8:31 Central Time this opens a GitHub issue with an overview of the PUBLIC
# dashboard and @mentions the repo owner, so GitHub emails it to the owner's notification
# address - the same method as RWAPI. No email passwords or app passwords needed.
# Data: Yahoo Finance only (never Eikon).
#
# GitHub cron is UTC with no daylight saving, so both 13:00 and 14:00 UTC are scheduled and
# tracker/wait_until.py keeps only today's correct slot and waits until 8:31 CT.

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # the report is opened as an issue; GitHub emails the @mentioned owner

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait until 8:31 CT
        id: gate
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python tracker/wait_until.py

      - name: Install dependencies
        if: steps.gate.outputs.send == 'true'
        run: pip install "yfinance>=0.2.66" "pandas>=2.2" "numpy>=1.26" "openpyxl>=3.1"

      - name: Build report
        if: steps.gate.outputs.send == 'true'
        run: python tracker/daily_report.py --issue-md report.md --mention "${{ github.repository_owner }}"

      - name: Open report issue (GitHub emails you)
        if: steps.gate.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-report --color 1F3864 --description "Daily 8:31 CT report" --force >/dev/null 2>&1 || true
          TITLE=$(head -n 1 report.md)
          tail -n +2 report.md > body.md
          gh issue create --title "$TITLE" --body-file body.md --label daily-report
