name: Daily email report (5:00 CT, Mon-Fri)

# Every weekday (Mon-Fri) at 5:00 AM Central Time this opens a GitHub issue with an overview of the PUBLIC
# dashboard, including the website's charts, and @mentions the repo owner so GitHub emails it
# (same method as RWAPI - no email passwords). Data: Yahoo Finance only (never Eikon).
#
# Charts are drawn as PNGs and stored on the `report-assets` branch under <date>/, so each
# day's email keeps its own charts.
# GitHub cron is UTC with no daylight saving and often starts late, so it is scheduled one hour
# early at both possible UTC hours; tracker/wait_until.py keeps today's slot and waits until 5:00 CT.

on:
  schedule:
    # 5:00 CT = 10:00 UTC (daylight time) / 11:00 UTC (standard time). GitHub's scheduler is
    # best-effort and busiest on the hour, so use off-peak minutes: two primary slots that wait
    # until 5:00, then backups that only send if today's report hasn't gone out.
    - cron: "17 9 * * 1-5"
    - cron: "17 10 * * 1-5"
    - cron: "43 10 * * 1-5"
    - cron: "23 11 * * 1-5"
    - cron: "53 11 * * 1-5"
    - cron: "37 12 * * 1-5"
    - cron: "3 13 * * 5"     # TEMPORARY test (Fri 13:03 UTC): proves GitHub fires this schedule; it skips sending
  workflow_dispatch:

permissions:
  contents: write   # push chart images to the report-assets branch
  issues: write     # the report is opened as an issue; GitHub emails the @mentioned owner

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      REPORT_TIME: "05:00"
      REPORT_TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait until 5:00 CT
        id: wait
        run: python tracker/wait_until.py

      - name: Skip if today's report already went out
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.wait.outputs.send }}" != "true" ]; then echo "send=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            N=$(gh issue list --repo "${{ github.repository }}" --label daily-report --state all \
                  --search "created:>=$(date -u +%F)" --json number --jq length 2>/dev/null || echo 0)
            if [ "${N:-0}" -gt 0 ]; then echo "Today's report already exists - skipping."; echo "send=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.gate.outputs.send == 'true'
        run: pip install "yfinance>=0.2.66" "pandas>=2.2" "numpy>=1.26" "openpyxl>=3.1" "matplotlib>=3.8"

      - name: Build report and charts
        if: steps.gate.outputs.send == 'true'
        run: |
          python tracker/daily_report.py \
            --charts-dir charts \
            --asset-base "https://raw.githubusercontent.com/${{ github.repository }}/report-assets" \
            --issue-md report.md --mention "${{ github.repository_owner }}"

      - name: Publish chart images (report-assets branch)
        if: steps.gate.outputs.send == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin report-assets >/dev/null 2>&1; then
            git fetch --depth 1 origin report-assets
            git worktree add --detach "$RUNNER_TEMP/assets" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/assets"
            (cd "$RUNNER_TEMP/assets" && git checkout --orphan report-assets && git rm -rfq .)
          fi
          cp -r charts/* "$RUNNER_TEMP/assets/"
          cd "$RUNNER_TEMP/assets"
          git add -A
          git commit -qm "Report charts $(ls -d */ | tail -n 1 | tr -d /)" || echo "No chart changes"
          git push -q origin HEAD:report-assets

      - name: Open report issue (GitHub emails you)
        if: steps.gate.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-report --color 1F3864 --description "Daily 5:00 CT report" --force >/dev/null 2>&1 || true
          TITLE=$(head -n 1 report.md)
          # Business days only: after a market holiday the latest close is unchanged, so if a report
          # for this data date already exists, don't send a repeat.
          DATA_DATE=$(echo "$TITLE" | awk -F' · ' '{print $2}')
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$DATA_DATE" ]; then
            N=$(gh issue list --repo "${{ github.repository }}" --label daily-report --state all \
                  --search "\"$DATA_DATE\" in:title" --json number --jq length 2>/dev/null || echo 0)
            if [ "${N:-0}" -gt 0 ]; then echo "A report for $DATA_DATE already exists (market holiday?) - skipping."; exit 0; fi
          fi
          tail -n +2 report.md > body.md
          gh issue create --title "$TITLE" --body-file body.md --label daily-report
