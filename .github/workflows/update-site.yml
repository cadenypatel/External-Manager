name: Refresh data and deploy site

on:
  schedule:
    # Mutual fund NAVs post ~6-8pm ET. Run weekday evenings and again the next morning
    # to catch late NAVs. (Cron is UTC: 01:30 UTC = 8:30pm EST / 9:30pm EDT.)
    - cron: "30 1 * * 2-6"
    - cron: "0 12 * * 2-6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull prices and compute metrics
        run: python tracker/manager_vol_tracker.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
